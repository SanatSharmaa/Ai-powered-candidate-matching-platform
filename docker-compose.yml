version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devhire-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devhire
      POSTGRES_PASSWORD: devhire
      POSTGRES_DB: devhire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
